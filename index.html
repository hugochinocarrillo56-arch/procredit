<!DOCTYPE html>
<html lang="es" style="background-color: #F8FAFC;">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProCredit - Préstamos con Respaldo Bancario</title>
    <meta name="description" content="Casa de empeño con garantía prendaria y respaldo bancario. Tasas competitivas y seguridad total.">
    <!-- Meta Theme Color para móviles (Android/iOS) -->
    <meta name="theme-color" content="#F8FAFC">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Tailwind Configuration -->
    <script>
      window.tailwind = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Paleta Blanca y Azul Profesional (Prendamas Style)
              primary: "#1E40AF",   // Blue 800 (Más serio y legible)
              secondary: "#F1F5F9", // Slate 100
              accent: "#3B82F6",    // Blue 500
              highlight: "#FF6B00", // Naranja vibrante para resaltar botones importantes
              
              // Superficies
              "surface-light": "rgba(240, 249, 255, 0.92)",   // Celeste muy claro con transparencia
              "background-light": "transparent", // Dejar ver el fondo de index.html
              
              "text-main": "#1E293B",      // Slate 800 (Texto muy legible)
              "text-muted": "#334155",     // Slate 700 (Más oscuro para legibilidad extrema)
              "text-dark": "#0F172A",      // Slate 900
              
              "surface-dark": "#F1F5F9",
            },
            fontFamily: {
              sans: ["Montserrat", "sans-serif"],
            },
            boxShadow: {
              'blue-glow': '0 10px 40px -10px rgba(59, 130, 246, 0.15)',
              'blue-intense': '0 20px 50px -12px rgba(30, 64, 175, 0.25)',
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.8s ease-out',
              'heartbeat': 'heartbeat 2s infinite ease-in-out',
              'pulse-subtle': 'pulseSubtle 2s infinite ease-in-out',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              heartbeat: {
                '0%, 100%': { transform: 'scale(1)' },
                '50%': { transform: 'scale(1.05)' },
              },
              pulseSubtle: {
                '0%, 100%': { opacity: '1', transform: 'scale(1)' },
                '50%': { opacity: '0.85', transform: 'scale(1.02)' },
              }
            }
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
      /* FONDO AZULADO ATMOSFÉRICO */
      html, body {
        background-color: #F0F9FF !important; /* Un tono base más azulado claro */
        
        color: #1E293B;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }

      /* Scrollbar Azul Profesional */
      .sidebar-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .sidebar-scroll::-webkit-scrollbar-thumb {
        background-color: #1E40AF; 
        border-radius: 3px;
      }
      body {
        font-family: 'Montserrat', sans-serif;
      }
    </style>

    <!-- Import Map: Fixed React Versions to Stable -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.292.0",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-background-light text-text-main antialiased selection:bg-primary selection:text-white">
    <div id="root"></div>
    <!-- Script de entrada vital para Vercel/Vite -->
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
