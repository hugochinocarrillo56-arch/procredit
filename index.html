<!DOCTYPE html>
<html lang="es" style="background-color: #F8FAFC;">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- FAVICON E ÍCONO DE GOOGLE (Estándares para SEO y Navegadores) -->
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-procredit-google.png" />
    <link rel="apple-touch-icon" href="/logo-procredit-google.png" />
    
    <!-- TÍTULO PRINCIPAL EN MAYÚSCULAS -->
    <title>PROCREDIT BOLIVIA</title>
    <meta name="description" content="ProCredit S.R.L. - Tu solución financiera rápida en El Alto y La Paz. Préstamos inmediatos con garantía de joyas, autos, inmuebles y electrónicos. Tasas competitivas y seguridad garantizada.">
    <meta name="keywords" content="ProCredit, préstamos El Alto, préstamos La Paz, casa de empeño Bolivia, empeñar joyas El Alto, empeñar auto La Paz, crédito rápido Bolivia, garantía prendaria, remates Bolivia, subastas ProCredit">
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://procredit.com.bo/">
    <meta property="og:title" content="PROCREDIT BOLIVIA">
    <meta property="og:description" content="Dinero al instante con la mejor tasa del mercado. Especialistas en garantía prendaria en El Alto y La Paz.">
    <meta property="og:image" content="https://procredit.com.bo/logo-procredit-google.png">
    <meta property="og:image:secure_url" content="https://procredit.com.bo/logo-procredit-google.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://procredit.com.bo/">
    <meta property="twitter:title" content="PROCREDIT BOLIVIA">
    <meta property="twitter:description" content="Dinero al instante con la mejor tasa del mercado. Especialistas en garantía prendaria en El Alto y La Paz.">
    <meta property="twitter:image" content="https://procredit.com.bo/logo-procredit-google.png">

    <link rel="canonical" href="https://procredit.com.bo/" />
    
    <!-- 1. Identificación de Organización y Logo para Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "PROCREDIT BOLIVIA",
      "url": "https://procredit.com.bo/",
      "logo": "https://procredit.com.bo/logo-procredit-google.png"
    }
    </script>

    <!-- 2. Identificación del Sitio Web para Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "PROCREDIT BOLIVIA",
      "alternateName": "ProCredit",
      "url": "https://procredit.com.bo/"
    }
    </script>

    <!-- 3. Menú de Navegación (Sitelinks) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ItemList",
          "itemListElement": [
            {
              "@type": "SiteNavigationElement",
              "position": 1,
              "name": "Servicio",
              "url": "https://procredit.com.bo/#servicios"
            },
            {
              "@type": "SiteNavigationElement",
              "position": 2,
              "name": "Empeños Seguros",
              "url": "https://procredit.com.bo/#empenos-seguros"
            },
            {
              "@type": "SiteNavigationElement",
              "position": 3,
              "name": "Verifica tu Préstamo",
              "url": "https://procredit.com.bo/#verifica-tu-prestamo"
            }
          ]
        }
      ]
    }
    </script>

    <!-- Meta Theme Color para móviles -->
    <meta name="theme-color" content="#F8FAFC">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Tailwind Configuration -->
    <script>
      window.tailwind = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: "#1E40AF",
              secondary: "#F1F5F9",
              accent: "#3B82F6",
              highlight: "#FF6B00",
              "surface-light": "rgba(240, 249, 255, 0.92)",
              "background-light": "transparent",
              "text-main": "#1E293B",
              "text-muted": "#334155",
              "text-dark": "#0F172A",
              "surface-dark": "#F1F5F9",
            },
            fontFamily: {
              sans: ["Montserrat", "sans-serif"],
            },
            boxShadow: {
              'blue-glow': '0 10px 40px -10px rgba(59, 130, 246, 0.15)',
              'blue-intense': '0 20px 50px -12px rgba(30, 64, 175, 0.25)',
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.8s ease-out',
              'heartbeat': 'heartbeat 2s infinite ease-in-out',
              'pulse-subtle': 'pulseSubtle 2s infinite ease-in-out',
              'whatsapp-pulse': 'whatsappPulse 2s infinite ease-in-out',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              heartbeat: {
                '0%, 100%': { transform: 'scale(1)' },
                '50%': { transform: 'scale(1.05)' },
              },
              pulseSubtle: {
                '0%, 100%': { opacity: '1', transform: 'scale(1)' },
                '50%': { opacity: '0.85', transform: 'scale(1.02)' },
              },
              whatsappPulse: {
                '0%': { transform: 'scale(1)', boxShadow: '0 0 0 0 rgba(37, 211, 102, 0.7)' },
                '70%': { transform: 'scale(1.05)', boxShadow: '0 0 0 15px rgba(37, 211, 102, 0)' },
                '100%': { transform: 'scale(1)', boxShadow: '0 0 0 0 rgba(37, 211, 102, 0)' },
              }
            }
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
      html, body {
        background-color: #F0F9FF !important;
        color: #1E293B;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      .sidebar-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .sidebar-scroll::-webkit-scrollbar-thumb {
        background-color: #1E40AF; 
        border-radius: 3px;
      }
      body {
        font-family: 'Montserrat', sans-serif;
      }
    </style>

    <!-- Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/": "https://esm.sh/react@18.3.1/",
        "react-dom": "https://esm.sh/react-dom@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0",
        "react-dom/": "https://esm.sh/react-dom@18.3.1/"
      }
    }
    </script>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-background-light text-text-main antialiased selection:bg-primary selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
