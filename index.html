<!DOCTYPE html>
<html lang="es" style="background-color: #050505;">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProCredit - Préstamos con Respaldo Bancario</title>
    <meta name="description" content="Casa de empeño con garantía prendaria y respaldo bancario. Tasas competitivas y seguridad total.">
    <!-- Meta Theme Color para móviles (Android/iOS) -->
    <meta name="theme-color" content="#050505">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Tailwind Configuration -->
    <script>
      window.tailwind = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Paleta Rojo y Negro (Red & Black Theme)
              primary: "#D62828",   // Rojo Intenso (Botones, Acentos)
              secondary: "#000000", // Negro Puro
              accent: "#FF4D4D",    // Rojo Brillante (Hover)
              
              // Superficies
              "surface-light": "#141414",   // Gris muy oscuro (Tarjetas)
              "background-light": "#050505", // Negro (Fondo Principal)
              
              "text-main": "#FFFFFF",      // Texto principal blanco
              "text-muted": "#A3A3A3",     // Texto secundario gris
              "text-dark": "#000000",      // Texto oscuro
              
              "surface-dark": "#000000",
            },
            fontFamily: {
              sans: ["Montserrat", "sans-serif"],
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.8s ease-out',
              'heartbeat': 'heartbeat 2s infinite ease-in-out',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              heartbeat: {
                '0%, 100%': { transform: 'scale(1)' },
                '50%': { transform: 'scale(1.05)' },
              }
            }
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
      /* FORZAR FONDO NEGRO INMEDIATO */
      html, body {
        background-color: #050505 !important;
        color: #FFFFFF;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }

      /* Scrollbar Roja */
      .sidebar-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .sidebar-scroll::-webkit-scrollbar-thumb {
        background-color: #D62828; 
        border-radius: 3px;
      }
      body {
        font-family: 'Montserrat', sans-serif;
      }
    </style>

    <!-- Import Map: Fixed React Versions to Stable -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.292.0",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/"
  }
}
</script>
</head>
  <body class="bg-background-light text-text-main antialiased selection:bg-primary selection:text-white">
    <div id="root"></div>
    <!-- Script de entrada vital para Vercel/Vite -->
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
